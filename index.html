    // ========================================================
    // 3. SIZING ALGORITHMS & MATCH COMPUTATION
    // ========================================================
    function calculateSizes(lengthCm) {
      const len = parseFloat(lengthCm) || 27.0;
      const internal = len + 1.0;
      const eu = Math.round((internal * 1.5) * 2) / 2;
      const ukIndia = Math.round(((eu - 33.5) / 1.33) * 2) / 2;
      const us = Math.round((ukIndia + 0.5) * 2) / 2;
      return { 
        uk: Math.max(5, Math.min(12, ukIndia)), 
        eu: Math.max(38, Math.min(48, eu)), 
        us: Math.max(5.5, Math.min(13, us)) 
      };
    }

    function classifyWidth(widthCm, lengthCm) {
      const w = parseFloat(widthCm) || 10.0;
      const l = parseFloat(lengthCm) || 27.0;
      const ratio = w / l;
      if (ratio < 0.355) return { category: "Narrow Fit", color: "text-[#E5B80B] bg-[#1A1D24] border-[#E5B80B]/40" };
      if (ratio <= 0.385) return { category: "Standard Fit", color: "text-[#34D399] bg-[#1B4D3E]/40 border-[#34D399]/40" };
      if (ratio <= 0.415) return { category: "Wide Fit (Nivia / Sega)", color: "text-[#E5B80B] bg-[#1A1D24] border-[#E5B80B]" };
      return { category: "Extra Wide 2E (Sega Star)", color: "text-[#F4F1EA] bg-[#991b1b]/80 border-[#E5B80B]" };
    }

    function calculateMatch(studs, widthCm) {
      const w = parseFloat(widthCm) || 10.0;
      const { min, max } = studs.widthToleranceCm;
      let score = 95;
      let status = "Optimal Anatomical Fit";

      if (w >= min && w <= max) {
        const center = (min + max) / 2;
        const dist = Math.abs(w - center);
        score = Math.round(100 - (dist / ((max - min) / 2)) * 8);
        status = "Optimal Anatomical Fit";
      } else if (w < min) {
        const diff = min - w;
        score = Math.max(75, Math.round(92 - diff * 18));
        status = "Comfort Roomy Stud Fit";
      } else {
        const diff = w - max;
        score = Math.max(65, Math.round(88 - diff * 26));
        status = diff > 0.5 ? "Pinch Risk (Too Narrow)" : "Snug Match Fit";
      }

      if (studs.brand === "Nivia" || studs.brand === "Sega") score = Math.min(100, score + 3);
      return { score, status };
    }

    // ========================================================
    // 4. ULTRA-REALISTIC 3D ANATOMICAL FOOT IN FOOTBALL SOCK
    // ========================================================
    function createRealisticFootSockGeometry() {
      const geom = new THREE.BufferGeometry();
      const vertices = [];
      const uvs = [];
      const indices = [];

      const rings = [];

      // 40 precision anatomical slices
      // Lower Leg & Calf (0 to 11)
      for (let i = 0; i <= 11; i++) {
        const t = i / 11;
        const y = 12.0 - t * 9.0;
        const rWidth = 1.95 - t * 0.48;
        const rDepth = 2.15 - t * 0.52;
        const zOffset = -2.6 - t * 0.75;
        rings.push({ center: [0, y, zOffset], rx: rWidth, ry: rDepth, isLeg: true });
      }

      // Ankle Malleolus & Heel Calcaneus (12 to 19)
      for (let i = 1; i <= 8; i++) {
        const t = i / 8;
        const angle = (t * Math.PI) / 2;
        const y = 3.0 - Math.sin(angle) * 2.3;
        const z = -3.35 - Math.cos(angle) * 1.9 + t * 0.6;
        const rx = 1.6 + Math.sin(t * Math.PI) * 0.42;
        const ry = 1.9;
        rings.push({ center: [0, Math.max(0.65, y), z], rx: rx, ry: ry, isTransition: true });
      }

      // Medial Arch & Instep (20 to 31)
      for (let i = 1; i <= 12; i++) {
        const t = i / 12;
        const z = -3.2 + t * 5.6;
        const archLift = Math.sin(t * Math.PI) * 0.55; // Noticeable real human arch lift!
        const y = 0.85 + (1 - t) * 0.68;
        const rx = 1.55 + t * 0.92;
        const ry = 1.6 - t * 0.72;
        rings.push({ center: [0.08, y, z], rx: rx, ry: ry, archLift: archLift, isSole: true });
      }

      // Toe Box (32 to 39)
      for (let i = 1; i <= 8; i++) {
        const t = i / 8;
        const z = 2.4 + t * 2.65;
        const y = 0.7 - t * 0.38;
        const rx = Math.max(0.38, 2.48 * (1 - t * 0.68));
        const ry = Math.max(0.28, 0.88 * (1 - t * 0.65));
        const xOffset = -0.32 * t;
        rings.push({ center: [xOffset, y, z], rx: rx, ry: ry, isToes: true });
      }

      const N_RADIAL = 32;

      for (let r = 0; r < rings.length; r++) {
        const ring = rings[r];
        const cx = ring.center[0];
        const cy = ring.center[1];
        const cz = ring.center[2];

        for (let j = 0; j < N_RADIAL; j++) {
          const theta = (j / N_RADIAL) * Math.PI * 2;
          let cos = Math.cos(theta);
          let sin = Math.sin(theta);

          let px = cx + cos * ring.rx;
          let py, pz;

          if (ring.isLeg) {
            py = cy;
            pz = cz + sin * ring.ry;
          } else {
            py = cy + sin * ring.ry;
            if (py < 0.05) py = 0.05;
            if (ring.archLift && cos < 0 && sin < 0) {
              py += ring.archLift * (-cos) * (-sin);
            }
            pz = cz;
          }

          vertices.push(px, py, pz);
          uvs.push(j / N_RADIAL, r / (rings.length - 1));
        }
      }

      for (let r = 0; r < rings.length - 1; r++) {
        for (let j = 0; j < N_RADIAL; j++) {
          const nextJ = (j + 1) % N_RADIAL;
          const i1 = r * N_RADIAL + j;
          const i2 = (r + 1) * N_RADIAL + j;
          const i3 = (r + 1) * N_RADIAL + nextJ;
          const i4 = r * N_RADIAL + nextJ;

          indices.push(i1, i2, i4);
          indices.push(i2, i3, i4);
        }
      }

      const tipIndex = vertices.length / 3;
      const lastRing = rings[rings.length - 1];
      vertices.push(lastRing.center[0], 0.32, lastRing.center[2] + 0.35);
      uvs.push(0.5, 1.0);

      const lastRingOffset = (rings.length - 1) * N_RADIAL;
      for (let j = 0; j < N_RADIAL; j++) {
        const nextJ = (j + 1) % N_RADIAL;
        indices.push(lastRingOffset + j, tipIndex, lastRingOffset + nextJ);
      }

      geom.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
      geom.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geom.setIndex(indices);
      geom.computeVertexNormals();
      return geom;
    }

    function generateSockTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 1024;
      const ctx = canvas.getContext('2d');

      // Base Sock: Charcoal / Crimson Knit
      ctx.fillStyle = '#991B1B';
      ctx.fillRect(0, 0, 1024, 1024);

      // Fine woven knit texture
      ctx.strokeStyle = 'rgba(0, 0, 0, 0.25)';
      ctx.lineWidth = 1;
      for (let x = 0; x < 1024; x += 4) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, 1024);
        ctx.stroke();
      }

      // Calf Cuff: Warm Ivory with Metallic Gold Stripe
      ctx.fillStyle = '#F4F1EA';
      ctx.fillRect(0, 30, 1024, 60);
      ctx.fillStyle = '#E5B80B';
      ctx.fillRect(0, 100, 1024, 25);
      ctx.fillStyle = '#F4F1EA';
      ctx.fillRect(0, 135, 1024, 30);

      // Compression Shin Chevrons in Warm Ivory
      ctx.fillStyle = '#F4F1EA';
      for (let i = 0; i < 3; i++) {
        const yPos = 210 + i * 55;
        ctx.beginPath();
        ctx.moveTo(512, yPos);
        ctx.lineTo(540, yPos + 30);
        ctx.lineTo(530, yPos + 30);
        ctx.lineTo(512, yPos + 12);
        ctx.lineTo(494, yPos + 30);
        ctx.lineTo(484, yPos + 30);
        ctx.closePath();
        ctx.fill();
      }

      // Instep Arch Band (Dark Turf Tone)
      ctx.fillStyle = '#1B4D3E';
      ctx.fillRect(0, 560, 1024, 90);
      ctx.fillStyle = '#E5B80B';
      ctx.fillRect(0, 595, 1024, 20);

      // Heel & Toe Guard
      ctx.fillStyle = '#1A1D24';
      ctx.fillRect(0, 420, 1024, 65);
      ctx.fillRect(0, 940, 1024, 84);

      // Silicone Anti-Slip Hexagonal Grip Pads (Metallic Gold)
      ctx.fillStyle = '#E5B80B';
      for (let row = 0; row < 7; row++) {
        for (let col = 0; col < 12; col++) {
          const px = 40 + col * 82;
          const py = 720 + row * 28;
          ctx.beginPath();
          ctx.arc(px, py, 6, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.ClampToEdgeWrapping;
      return texture;
    }

    function Foot3DViewer({ lengthCm, widthCm }) {
      const mountRef = useRef(null);
      const footMeshRef = useRef(null);
      const lengthCaliperRef = useRef(null);
      const widthCaliperRef = useRef(null);
      const controlsRef = useRef(null);
      const cameraRef = useRef(null);
      const [isRotating, setIsRotating] = useState(true);

      useEffect(() => {
        const mount = mountRef.current;
        if (!mount) return;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0F1115); // Deep Obsidian

        const width = mount.clientWidth || 600;
        const height = mount.clientHeight || 500;

        const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 100);
        camera.position.set(22, 16, 26);
        cameraRef.current = camera;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        renderer.shadowMap.enabled = true;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.15;
        mount.appendChild(renderer.domElement);

        let controls = null;
        if (typeof THREE.OrbitControls === 'function') {
          controls = new THREE.OrbitControls(camera, renderer.domElement);
          controls.enableDamping = true;
          controls.dampingFactor = 0.05;
          controls.maxDistance = 55;
          controls.minDistance = 12;
          controlsRef.current = controls;
        }

        // Lighting
        scene.add(new THREE.AmbientLight(0xF4F1EA, 1.8));
        const keyLight = new THREE.DirectionalLight(0xF4F1EA, 2.5);
        keyLight.position.set(16, 26, 18);
        keyLight.castShadow = true;
        scene.add(keyLight);

        const goldRim = new THREE.DirectionalLight(0xE5B80B, 2.0);
        goldRim.position.set(-18, 14, -16);
        scene.add(goldRim);

        // Ground Platform with Turf Ring
        const ringGeo = new THREE.RingGeometry(13.8, 14.1, 64);
        const outerRing = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({ color: 0x1B4D3E, side: THREE.DoubleSide }));
        outerRing.rotation.x = Math.PI / 2;
        scene.add(outerRing);

        const grid = new THREE.GridHelper(30, 24, 0xE5B80B, 0x1A1D24);
        grid.position.y = -0.02;
        scene.add(grid);

        // 3D Realistic Foot Mesh
        const sockTexture = generateSockTexture();
        const sockMaterial = new THREE.MeshStandardMaterial({
          map: sockTexture,
          roughness: 0.65,
          metalness: 0.08
        });

        const footGeo = createRealisticFootSockGeometry();
        const footMesh = new THREE.Mesh(footGeo, sockMaterial);
        footMesh.castShadow = true;
        footMesh.receiveShadow = true;
        footMeshRef.current = footMesh;
        scene.add(footMesh);

        // Laser Calipers
        const lenGroup = new THREE.Group();
        lengthCaliperRef.current = lenGroup;
        scene.add(lenGroup);

        const goldLineMat = new THREE.LineBasicMaterial({ color: 0xE5B80B, linewidth: 3 });
        const lenGeo = new THREE.BufferGeometry().setFromPoints([
          new THREE.Vector3(-3.8, 0.1, -5.8),
          new THREE.Vector3(-3.8, 0.1, 5.2)
        ]);
        lenGroup.add(new THREE.Line(lenGeo, goldLineMat));

        const makeTick = (p1, p2) => {
          const g = new THREE.BufferGeometry().setFromPoints([p1, p2]);
          return new THREE.Line(g, new THREE.LineBasicMaterial({ color: 0xE5B80B, linewidth: 2 }));
        };
        lenGroup.add(makeTick(new THREE.Vector3(-4.8, 0.1, -5.8), new THREE.Vector3(-2.8, 0.1, -5.8)));
        lenGroup.add(makeTick(new THREE.Vector3(-4.8, 0.1, 5.2), new THREE.Vector3(-2.8, 0.1, 5.2)));

        const widGroup = new THREE.Group();
        widthCaliperRef.current = widGroup;
        scene.add(widGroup);

        const widGeo = new THREE.BufferGeometry().setFromPoints([
          new THREE.Vector3(-3.2, 0.1, 2.0),
          new THREE.Vector3(3.4, 0.1, 2.0)
        ]);
        widGroup.add(new THREE.Line(widGeo, new THREE.LineBasicMaterial({ color: 0x34D399, linewidth: 3 })));
        widGroup.add(makeTick(new THREE.Vector3(-3.2, 0.1, 1.0), new THREE.Vector3(-3.2, 0.1, 3.0)));
        widGroup.add(makeTick(new THREE.Vector3(3.4, 0.1, 1.0), new THREE.Vector3(3.4, 0.1, 3.0)));

        let frameId;
        const animate = () => {
          frameId = requestAnimationFrame(animate);
          if (isRotating && footMeshRef.current) {
            footMeshRef.current.rotation.y += 0.003;
          }
          if (controlsRef.current) controlsRef.current.update();
          renderer.render(scene, camera);
        };
        animate();

        const handleResize = () => {
          if (!mount) return;
          const w = mount.clientWidth;
          const h = mount.clientHeight;
          camera.aspect = w / h;
          camera.updateProjectionMatrix();
          renderer.setSize(w, h);
        };
        window.addEventListener('resize', handleResize);

        return () => {
          window.removeEventListener('resize', handleResize);
          cancelAnimationFrame(frameId);
          if (mount && renderer.domElement) mount.removeChild(renderer.domElement);
          renderer.dispose();
        };
      }, []);

      useEffect(() => {
        if (!footMeshRef.current) return;
        const scaleZ = parseFloat(lengthCm) / 27.0;
        const scaleX = parseFloat(widthCm) / 10.0;
        footMeshRef.current.scale.set(scaleX, 1.0, scaleZ);

        if (lengthCaliperRef.current) lengthCaliperRef.current.scale.set(1.0, 1.0, scaleZ);
        if (widthCaliperRef.current) widthCaliperRef.current.scale.set(scaleX, 1.0, 1.0);
      }, [lengthCm, widthCm]);

      const setPreset = (view) => {
        if (!cameraRef.current) return;
        setIsRotating(false);
        const c = cameraRef.current;
        if (view === 'top') c.position.set(0.01, 32, 0.01);

        if (controlsRef.current) {
          controlsRef.current.target.set(0, 2.5, 0);
          controlsRef.current.update();
        }
      };

      return (
        <div className="relative w-full h-[480px] lg:h-[560px] bg-[#14171E] rounded-3xl overflow-hidden border-2 border-[#2A2F3A] hover:border-[#E5B80B]/50 transition shadow-2xl">

              <span className="text-xs font-bold text-[#F4F1EA] tracking-wide">

              </span>
            </div>

            <button
              onClick={() => setIsRotating(!isRotating)}
              className="pointer-events-auto px-3 py-1.5 text-xs font-mono rounded-xl bg-[#1A1D24] border border-[#2A2F3A] text-[#A0A6B1] hover:text-[#F4F1EA] hover:border-[#E5B80B] transition"
            >
              {isRotating ? 'Rotation: ON' : 'Rotation: Paused'}
            </button>
          </div>

          {/* Real-time Measurements Badges */}
          <div className="absolute bottom-16 left-4 flex flex-col gap-2.5 pointer-events-none font-mono-num">
            <div className="bg-[#1A1D24]/95 backdrop-blur-md px-4 py-2 rounded-2xl border border-[#E5B80B] text-xs shadow-lg">
              <span className="text-[#E5B80B] block text-[10px] uppercase font-bold">FOOT LENGTH (HEEL-TO-TOE)</span>
              <span className="font-extrabold text-[#F4F1EA] text-base">{lengthCm} cm</span>
              <span className="text-[11px] text-[#A0A6B1] ml-1.5">({(lengthCm * 10).toFixed(0)} mm)</span>
            </div>

            <div className="bg-[#1A1D24]/95 backdrop-blur-md px-4 py-2 rounded-2xl border border-[#34D399] text-xs shadow-lg">
              <span className="text-[#34D399] block text-[10px] uppercase font-bold">FOREFOOT WIDTH (BALL)</span>

            </div>

            <span className="text-[11px] font-bold text-[#A0A6B1] px-2">Angle:</span>
            {[
              { id: 'iso', label: '3D Iso' },
              { id: 'top', label: 'Top (Plan)' },
              { id: 'side', label: 'Arch Profile' },
              { id: 'sole', label: 'Sole Grips' }

              <button
                key={view.id}

              >
                {view.label}
              </button>
            ))}
          </div>
        </div>
      );
    }

                      </div>
                      <div className="text-lg font-bold tracking-widest text-[#F4F1EA]">{card.number}</div>
                      <div className="flex justify-between text-[10px] text-[#A0A6B1]">
                        <span>{card.name}</span>
                        <span>{card.exp}</span>
                      </div>
                    </div>
                  )}

                  {paymentMethod === 'cod' && (
                    <div className="p-4 bg-[#14171E] border border-[#2A2F3A] rounded-2xl text-[#F4F1EA]">
                      <p className="font-bold text-[#E5B80B]">Cash on Delivery Available</p>
                      <p className="text-xs text-[#A0A6B1] mt-0.5">Pay in cash or UPI when your studs arrive at your doorstep.</p>
                    </div>
                  )}

                  <button
                    onClick={handleConfirm}
                    className="w-full py-4 bg-[#E5B80B] hover:bg-yellow-400 text-[#0F1115] font-black text-sm uppercase rounded-2xl transition shadow-xl"
                  >
                    Confirm & Place Order (₹{subtotal.toLocaleString('en-IN')})
                  </button>
                </div>
              )}
            </div>

            {/* Right Column: Pricing Breakdown */}
            <div className="md:col-span-5 bg-[#1A1D24] border-2 border-[#2A2F3A] rounded-3xl p-6 shadow-xl space-y-4 font-mono-num text-xs">
              <h4 className="text-sm font-bold text-[#E5B80B] uppercase border-b border-[#2A2F3A] pb-2">
                Order Total
              </h4>
              <div className="flex justify-between text-[#A0A6B1]">
                <span>Studs Subtotal</span>
                <span className="text-[#F4F1EA]">₹{subtotal.toLocaleString('en-IN')}</span>
              </div>
              <div className="flex justify-between text-[#A0A6B1]">
                <span>Express Sports Courier</span>
                <span className="text-[#34D399] font-bold">FREE (₹0)</span>
              </div>
              <div className="flex justify-between text-[#A0A6B1]">
                <span>Extra Stud Laces</span>
                <span className="text-[#E5B80B] font-bold">INCLUDED</span>
              </div>
              <div className="flex justify-between text-[#A0A6B1]">
                <span>Anti-Blister Pitch Guarantee</span>
                <span className="text-[#34D399]">30 DAYS</span>
              </div>
              <div className="pt-3 border-t border-[#2A2F3A] flex justify-between items-baseline text-white">
                <span className="text-sm font-sans font-black text-[#E5B80B]">Total Due</span>
                <span className="text-2xl font-black text-[#F4F1EA] font-mono-num">₹{subtotal.toLocaleString('en-IN')}</span>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ========================================================
    // 8. DEDICATED BOOKING STATUS & ORDER TRACKING PAGE
    // ========================================================
    function BookingStatusPage({ order, measurements, onRestart, onBackToCatalog }) {
      return (
        <div className="max-w-3xl mx-auto py-8 px-4 animate-fadeIn space-y-6">
          {/* Header Card */}
          <div className="bg-[#1A1D24] border-2 border-[#2A2F3A] rounded-3xl p-6 lg:p-8 shadow-2xl text-center relative overflow-hidden">
            <div className="w-16 h-16 rounded-2xl bg-[#1B4D3E] text-[#34D399] flex items-center justify-center text-3xl font-black mx-auto mb-3 shadow-lg border border-[#34D399]/40">
              ✓
            </div>
            <span className="text-xs text-[#34D399] uppercase font-bold tracking-widest bg-[#1B4D3E]/30 px-3 py-1 rounded-full border border-[#34D399]/30">
              Booking Confirmed & Dispatched
            </span>
            <h2 className="text-2xl lg:text-3xl font-black text-[#F4F1EA] mt-2">
              Football Studs Order Tracking
            </h2>
            <p className="text-xs text-[#A0A6B1] font-mono-num mt-1">
              Tracking ID: <strong className="text-[#E5B80B]">{order.orderId}</strong> • Expected: <strong className="text-[#34D399]">{order.expectedDelivery}</strong>
            </p>

            {/* LIVE STEP TIMELINE */}
            <div className="mt-8 pt-6 border-t border-[#2A2F3A] text-left">
              <span className="text-[11px] font-bold text-[#E5B80B] uppercase tracking-wider block mb-4">
                Dispatch Status Timeline
              </span>
              <div className="space-y-4">
                {[
                  { step: '1', title: 'Order Confirmed & Biometrics Verified', time: 'Today, 2:15 PM', status: 'done', desc: 'Foot Length (27.2cm) and Width (10.4cm) calibrated with soleplate last.' },
                  { step: '2', title: 'Studs Quality Checked & Torque Tested', time: 'Today, 2:45 PM', status: 'done', desc: 'All 14 TPU studs inspected for hardness and zero sole separation.' },
                  { step: '3', title: 'Dispatched via Sports Courier (Blue Dart)', time: 'Today, 3:30 PM', status: 'current', desc: 'Air Waybill #BD9821482IN — In transit to sorting hub.' },
                  { step: '4', title: 'Out for Pitch Delivery', time: 'Estimated in 48 hrs', status: 'pending', desc: 'Courier agent will contact via SMS prior to doorstep delivery.' }
                ].map((s, idx) => (
                  <div key={s.step} className="flex items-start gap-3.5">
                    <div className={`w-7 h-7 rounded-full flex items-center justify-center text-xs font-black flex-shrink-0 ${
                      s.status === 'done'
                        ? 'bg-[#1B4D3E] text-[#34D399] border border-[#34D399]'
                        : s.status === 'current'
                        ? 'bg-[#E5B80B] text-[#0F1115] font-black animate-pulse'
                        : 'bg-[#14171E] text-[#A0A6B1] border border-[#2A2F3A]'
                    }`}>
                      {s.status === 'done' ? '✓' : s.step}
                    </div>
                    <div className="flex-1 pb-3 border-b border-[#2A2F3A]/60">
                      <div className="flex justify-between items-baseline">
                        <h4 className={`text-xs font-bold ${s.status === 'current' ? 'text-[#E5B80B]' : 'text-[#F4F1EA]'}`}>
                          {s.title}
                        </h4>
                        <span className="text-[10px] font-mono-num text-[#A0A6B1]">{s.time}</span>
                      </div>
                      <p className="text-[11px] text-[#A0A6B1] mt-0.5">{s.desc}</p>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            {/* Booked Item Summary Box */}
            <div className="mt-6 p-4 rounded-2xl bg-[#14171E] border border-[#2A2F3A] text-left text-xs font-mono-num space-y-3">
              <div className="flex justify-between border-b border-[#2A2F3A] pb-2">
                <span className="text-[#A0A6B1]">Item Booked:</span>
                <span className="text-[#F4F1EA] font-bold">{order.items[0]?.name || 'Nivia Ashtang Studs'}</span>
              </div>
              <div className="flex justify-between border-b border-[#2A2F3A] pb-2">
                <span className="text-[#A0A6B1]">Selected Size:</span>
                <span className="text-[#E5B80B] font-bold">UK / IND {order.items[0]?.selectedSize || 8}</span>
              </div>
              <div className="flex justify-between border-b border-[#2A2F3A] pb-2">
                <span className="text-[#A0A6B1]">Destination Address:</span>
                <span className="text-[#F4F1EA] font-bold">{order.address.fullName}, {order.address.city} (PIN: {order.address.postalCode})</span>
              </div>
              <div className="flex justify-between border-b border-[#2A2F3A] pb-2">
                <span className="text-[#A0A6B1]">Payment Method:</span>
                <span className="text-[#34D399] font-bold">{order.paymentMethod}</span>
              </div>
              <div className="flex justify-between pt-1">
                <span className="text-[#A0A6B1]">Amount Paid:</span>
                <span className="text-base font-black text-[#E5B80B]">₹{order.total.toLocaleString('en-IN')}</span>
              </div>
            </div>

            {/* Buttons */}
            <div className="mt-8 flex flex-col sm:flex-row gap-3 justify-center">
              <button
                onClick={() => window.print()}
                className="px-6 py-3 rounded-2xl bg-[#14171E] hover:bg-[#0F1115] text-[#F4F1EA] text-xs font-bold border border-[#2A2F3A] hover:border-[#E5B80B] transition"
              >
                🖨️ Print Booking Invoice
              </button>
              <button
                onClick={onRestart}
                className="px-6 py-3 rounded-2xl bg-[#E5B80B] hover:bg-yellow-400 text-[#0F1115] text-xs font-black uppercase tracking-wider transition shadow-lg"
              >
                Scan Another Foot / New Booking
              </button>
            </div>
          </div>
        </div>
      );
    }

    try {
      const rootElement = document.getElementById('root');
      if (ReactDOM.createRoot) {
        ReactDOM.createRoot(rootElement).render(
          <ErrorBoundary>
            <App />
          </ErrorBoundary>
        );
      } else {
        ReactDOM.render(
          <ErrorBoundary>
            <App />
          </ErrorBoundary>,
          rootElement
        );
      }
    } catch (err) {
      console.error("Mount error:", err);
    }
  </script>
</body>
</html>
